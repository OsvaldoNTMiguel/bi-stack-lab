version: '3.8'

services:
  # 🗂️ Armazenamento de objetos S3 compatível
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password

  # ⚡ Engine distribuído de processamento de dados
  spark:
    image: bitnami/spark:latest
    ports:
      - "8080:8080"   # UI do Spark Master

  # 🔄 Orquestrador de workflows
  airflow:
    image: apache/airflow:2.9.1
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__WEBSERVER__RBAC=True
    ports:
      - "8088:8080"   # UI do Airflow

  # 📊 Plataforma de visualização de dados
  superset:
    image: apache/superset
    ports:
      - "8081:8088"   # UI do Superset
    environment:
      - SUPERSET_SECRET_KEY=your-secret-key
      - DATABASE_URL=sqlite:///superset.db  # Para testes locais

  # 📈 BI simples e direto ao ponto
  metabase:
    image: metabase/metabase
    ports:
      - "3000:3000"   # UI do Metabase

  # 🧠 Motor de consulta de dados analíticos
  druid:
    image: apache/druid:latest
    ports:
      - "9090:8081"   # UI do Druid

  # 🔎 Catálogo de metadados e observabilidade
  openmetadata:
    image: docker.getcollate.io/openmetadata/server:1.2.4
    ports:
      - "8082:8585"  # UI do OpenMetadata
    environment:
      - SERVER_HOSTNAME=http://localhost:8082
