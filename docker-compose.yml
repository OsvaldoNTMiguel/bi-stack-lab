version: '3.8'

services:
  # 🗂️ Armazenamento de objetos estilo S3
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # Painel web
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password

  # ⚡ Engine de processamento de dados
  spark:
    image: bitnami/spark:3.5.1
    ports:
      - "8080:8080"  # Spark Master UI

  # 🔄 Orquestrador de workflows
  airflow:
    image: apache/airflow:2.9.1
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__WEBSERVER__RBAC=True
    ports:
      - "8088:8080"  # UI do Airflow

  # 📊 Plataforma de dashboarding
  superset:
    image: apache/superset:3.0.1
    ports:
      - "8081:8088"  # UI do Superset
    environment:
      - SUPERSET_SECRET_KEY=your-secret-key
      - DATABASE_URL=sqlite:///superset.db

  # 📈 Análise e visualização self-service
  metabase:
    image: metabase/metabase:v0.49.11
    ports:
      - "3000:3000"  # UI do Metabase

  # 🧠 Engine analítico para queries OLAP
  druid:
    image: apache/druid:27.0.0
    ports:
      - "9090:8081"  # UI do Druid

  # 🧾 Catálogo de metadados e observabilidade
  openmetadata:
    image: docker.getcollate.io/openmetadata/server:1.2.4
    ports:
      - "8082:8585"  # UI do OpenMetadata
    environment:
      - SERVER_HOSTNAME=http://localhost:8082
