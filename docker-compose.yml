
services:
  # 🗂️ Armazenamento de objetos estilo S3
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password

  # ⚡ Engine de processamento de dados
  spark:
    image: bitnami/spark:3.5.1
    ports:
      - "8080:8080"

  # 🔄 Orquestrador de workflows (Airflow)
  airflow:
    image: apache/airflow:2.9.1
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__WEBSERVER__RBAC=True
    ports:
      - "8088:8080"
    command: webserver
    volumes:
      - airflow_data:/opt/airflow


  # 📊 Plataforma de dashboarding (Superset)
  superset:
    image: apache/superset:3.0.1
    ports:
      - "8081:8088"
    environment:
      - SUPERSET_SECRET_KEY=your-secret-key
      - DATABASE_URL=sqlite:///superset.db

  # 📈 BI self-service com Metabase
  metabase:
    image: metabase/metabase:v0.49.11
    ports:
      - "3000:3000"

  # 🧠 Engine analítico OLAP (Druid)
  druid:
    image: apache/druid:27.0.0
    ports:
      - "9090:8888"
    command:
      - "bin/start-micro-quickstart"

  # 🗄️ Banco de dados para OpenMetadata
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: openmetadata_db
      MYSQL_USER: metadata_user
      MYSQL_PASSWORD: metadata_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🔎 Catálogo de metadados (OpenMetadata)
  openmetadata:
    image: docker.getcollate.io/openmetadata/server:1.2.4
    ports:
      - "8082:8585"
    environment:
      - SERVER_HOSTNAME=http://localhost:8082
      - OPENMETADATA_DATABASE_HOST=mysql
      - OPENMETADATA_DATABASE_PORT=3306
      - OPENMETADATA_DATABASE_USER=metadata_user
      - OPENMETADATA_DATABASE_PASSWORD=metadata_pass
      - OPENMETADATA_DATABASE_NAME=openmetadata_db
      - OPENMETADATA_DATABASE_SCHEME=mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  airflow_data:
